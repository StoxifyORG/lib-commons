name: Release shared packages

# Uses Changesets:
#  - On push to main with pending changeset files → opens/updates a
#    "Version Packages" PR (runs `pnpm version-packages` = `changeset version`).
#  - On merge of that PR → publishes the bumped versions to GitHub Packages
#    (runs `pnpm build && pnpm release` = `changeset publish`).
on:
  push:
    branches: [main]

permissions:
  contents: write        # commit version bumps, push tags
  pull-requests: write   # open the Version Packages PR
  packages: write        # publish to GitHub Packages

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com

      - name: Install
        run: pnpm install

      - name: Build
        run: pnpm build

      - name: Create Release Pull Request or Publish
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
